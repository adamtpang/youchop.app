<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouChop OG card</title>
<!-- 1200x630 Open Graph card. Rendered to /og.png by tools/make-og.mjs.
     Colors and type match site.css (light theme). The chapter block is the
     exact paste format "Make chapters for comment" produces, with neutral titles. -->
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --line: #d9d9df; --ink: #1d1d1f; --mut: #626269;
    --action: #bd3027; --red: #b92d23;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --disp: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--disp); padding: 56px 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 600; letter-spacing: -0.5px; }
  .brand svg { width: 48px; height: 48px; }
  h1 { font-size: 48px; white-space: nowrap; line-height: 1.08; font-weight: 700; letter-spacing: -1.5px; margin-top: 26px; }
  .row { flex: 1; display: grid; grid-template-columns: 392px 56px 1fr; align-items: center; margin-top: 34px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 2px #0000000d, 0 8px 24px #0000000f; }
  .in { padding: 28px 26px; }
  .label { font-size: 15px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: 0.8px; }
  .field { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 19px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .btn { margin-top: 16px; display: block; width: 100%; background: var(--action); color: #fff; border-radius: 12px; padding: 14px; font-size: 22px; font-weight: 600; text-align: center; }
  .arrow { justify-self: center; }
  .out { padding: 26px 30px; }
  .chapters { margin-top: 12px; font-family: var(--mono); font-size: 25px; line-height: 1.55; }
  .chapters b { color: var(--red); font-weight: 600; margin-right: 14px; }
  .credit { margin-top: 8px; font-family: var(--mono); font-size: 15px; color: var(--mut); }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#16161c"/><line x1="43" y1="100" x2="85" y2="28" stroke="#ff4930" stroke-width="27" stroke-linecap="round"/></svg>
    YouChop
  </div>
  <h1>Transcripts and chapters from any YouTube link.</h1>
  <div class="row">
    <div class="panel in">
      <div class="label">YouTube link</div>
      <div class="field">youtube.com/watch?v=...</div>
      <div class="btn">Chop</div>
    </div>
    <svg class="arrow" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#626269" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
    <div class="panel out">
      <div class="label">Chapters, ready to paste</div>
      <div class="chapters">
        <div><b>0:00</b>Chapter 1</div>
        <div><b>4:12</b>Chapter 2</div>
        <div><b>9:37</b>Chapter 3</div>
        <div><b>15:05</b>Chapter 4</div>
      </div>
      <div class="credit">Chapters by https://youchop.vercel.app</div>
    </div>
  </div>
</body>
</html>
